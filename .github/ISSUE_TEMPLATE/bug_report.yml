name: Bug report
description: Report incorrect behavior in Cocoarynth Trace.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Cocoarynth Trace.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the incorrect behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: batch
    attributes:
      label: Batch number
      description: Include the affected batch number when applicable.
